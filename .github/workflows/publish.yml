name: Publish to PyPI
# Uses PyPI "trusted publishing" (no API token stored in GitHub).
# One-time setup on pypi.org: Account -> Publishing -> add a pending publisher:
#   project name: injection-bench | owner: ashishdhillon | repo: injection-bench | workflow: publish.yml | environment: pypi
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine pytest && pip install -e .
      - run: pytest -q
      - run: python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
